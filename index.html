<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="Weather-App/styles.css">
</head>
<body>
  <main>
    <h1>Weather App</h1>
    <div class="app-container">
      <input placeholder="Enter city name" type="text" name="city-name" class="city-name-input" />
      <button type="button" class="get-weather-btn">
        <img src="Weather-App/assets/icons/magnifier.png" alt="Magnifier Icon" width="15.5">
      </button>
      <div class="weather-container">
        <div class="main-weather-page">
           <div class="weather-icon"></div>
           <div class="temperature"></div>
           <div class="city-name"></div>
           <div class="description"></div>
        </div>
        <div class="second-weather-page">
          <div>
            <p class="detail humidity-icon">💧</p>
            <p class="data humidity"></p>
          </div>
          <div>
            <p class="detail wind-speed-icon">💨</p>
            <p class="data wind-speed"></p>
          </div>
          <div>
            <p class="detail temp-max-icon">⬆️</p>
            <p class="data temp-max"></p>
          </div>
          <div>
            <p class="detail temp-min-icon">⬇️</p>
            <p class="data temp-min"></p>
          </div>
          
        </div>
    </div>
  </main>
  <script src="Weather-App/script.js" type="module"></script>
</body>
</html>
